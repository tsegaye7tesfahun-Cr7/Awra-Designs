    <!-- Structured Data — FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What services does Awra Designs offer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We offer architecture, interior design, 3D visualization, finishing and fit-out, building permit documentation, and branding services across Addis Ababa and Ethiopia."
          }
        },
        {
          "@type": "Question",
          "name": "How do I start a project with Awra Designs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Contact us via WhatsApp, phone, or our contact form. We schedule a free initial consultation to understand your vision, requirements, and budget, then provide a tailored proposal."
          }
        },
        {
          "@type": "Question",
          "name": "How long does a typical project take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A single room typically takes 4–8 weeks. A full apartment or commercial space ranges from 3–6 months. Architecture and permit documentation takes 3–6 weeks."
          }
        },
        {
          "@type": "Question",
          "name": "Do you work outside of Addis Ababa?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. While based in Addis Ababa, we take on projects across Ethiopia, coordinating through digital tools and site visits at key milestones."
          }
        },
        {
          "@type": "Question",
          "name": "How is your pricing structured?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pricing depends on project type, scale, and complexity. We offer fixed-fee contracts and percentage-of-cost models. Contact us for a free initial estimate."
          }
        }
      ]
    }
